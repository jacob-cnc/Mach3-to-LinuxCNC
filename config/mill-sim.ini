# ============================================================================
# 3040 mill: LinuxCNC simulation config
# No hardware. sim_hardware.hal stands in for the Mesa 7i96S + 7i85S.
# Purpose: a target for custom GUI development, and the starting point for
# the Phase 3 machine config (docs/retrofit-plan.md).
#
# Units: inch internally, as on the lathe (D3). G20 and G21 programs both run.
# Travel, speeds and spindle range are PLACEHOLDERS until the Phase 1 survey:
#   travel   vendor listing for the steel 3040, 300 x 400 x 80 mm; which of
#            X/Y is the 400 mm axis is assumed, not confirmed
#   speeds   OEM Mach3 example, 1000 mm/min and 400 mm/s^2
#   spindle  typical 2.2 kW 24,000 rpm water-cooled spindle on a VFD
# ============================================================================

[EMC]
VERSION = 1.1
MACHINE = Mill-3040-sim
DEBUG = 0

[DISPLAY]
DISPLAY = axis
CYCLE_TIME = 0.100
POSITION_OFFSET = RELATIVE
POSITION_FEEDBACK = ACTUAL
MAX_FEED_OVERRIDE = 1.5
MAX_SPINDLE_OVERRIDE = 1.2
MIN_SPINDLE_OVERRIDE = 0.5
DEFAULT_SPINDLE_SPEED = 12000
PROGRAM_PREFIX = ~/linuxcnc/nc_files
INCREMENTS = .1in .01in .001in .0001in 1mm .1mm .01mm
GEOMETRY = XYZ
MIN_LINEAR_VELOCITY = 0.0
DEFAULT_LINEAR_VELOCITY = 0.25
MAX_LINEAR_VELOCITY = 0.65

[FILTER]
PROGRAM_EXTENSION = .py Python Script
py = python3

[RS274NGC]
PARAMETER_FILE = mill-sim.var
RS274NGC_STARTUP_CODE = G17 G20 G40 G49 G54 G80 G90 G94

[EMCMOT]
EMCMOT = motmod
COMM_TIMEOUT = 1.0
SERVO_PERIOD = 1000000

[TASK]
TASK = milltask
CYCLE_TIME = 0.010

[HAL]
HALUI = halui
# Core logic, shared by the sim and the future machine config.
HALFILE = mill_core.hal
# Hardware layer. Phase 3 replaces this with mesa_hardware.hal.
HALFILE = sim_hardware.hal

[HALUI]

[KINS]
KINEMATICS = trivkins coordinates=XYZ
JOINTS = 3

[TRAJ]
COORDINATES = X Y Z
LINEAR_UNITS = inch
ANGULAR_UNITS = degree
MAX_LINEAR_VELOCITY = 0.65
DEFAULT_LINEAR_VELOCITY = 0.25
MAX_LINEAR_ACCELERATION = 15.0
DEFAULT_LINEAR_ACCELERATION = 15.0

[EMCIO]
EMCIO = iov2
CYCLE_TIME = 0.100
TOOL_TABLE = tool.tbl

# ============================================================================
# SPINDLE: VFD, no encoder. At-speed is a fixed spin-up delay (mill_core.hal).
# ============================================================================
[SPINDLE_0]
MAX_FORWARD_VELOCITY = 24000
MIN_FORWARD_VELOCITY = 6000
MAX_REVERSE_VELOCITY = 24000
MIN_REVERSE_VELOCITY = 6000
# Seconds from spindle on until feed moves may start. Placeholder.
SPINUP_DELAY = 3.0

# ============================================================================
# Homing and switches (D4): the two limit switches on each axis are wired in
# series to one input, which serves as home and as both hard limits.
# X and Y home at their minimum end, Z at the top. HOME_OFFSET is where the
# switch releases; each axis then moves to HOME, clear of the switch.
# SIM_SWITCH_MIN/MAX are the simulated switch positions (sim_hardware.hal).
# ============================================================================

# JOINT 0: X axis. Placeholder travel 15.5 in (400 mm axis assumed).
[JOINT_0]
TYPE = LINEAR
HOME = 0.0
MIN_LIMIT = 0.0
MAX_LIMIT = 15.5
MAX_VELOCITY = 0.65
MAX_ACCELERATION = 15.0
FERROR = 0.050
MIN_FERROR = 0.010
BACKLASH = 0.0
HOME_OFFSET = -0.05
HOME_SEARCH_VEL = -0.40
HOME_LATCH_VEL = 0.02
HOME_USE_INDEX = NO
HOME_IGNORE_LIMITS = YES
HOME_SEQUENCE = 1
SIM_SWITCH_MIN = -0.05
SIM_SWITCH_MAX = 15.55
# Machine config (Phase 3): 320 steps/mm = 8128 steps/in, assuming a 1605
# ballscrew at 1/8 microstep. Not used by the sim.
STEP_SCALE = 8128

# JOINT 1: Y axis. Placeholder travel 11.5 in (300 mm axis assumed).
[JOINT_1]
TYPE = LINEAR
HOME = 0.0
MIN_LIMIT = 0.0
MAX_LIMIT = 11.5
MAX_VELOCITY = 0.65
MAX_ACCELERATION = 15.0
FERROR = 0.050
MIN_FERROR = 0.010
BACKLASH = 0.0
HOME_OFFSET = -0.05
HOME_SEARCH_VEL = -0.40
HOME_LATCH_VEL = 0.02
HOME_USE_INDEX = NO
HOME_IGNORE_LIMITS = YES
HOME_SEQUENCE = 1
SIM_SWITCH_MIN = -0.05
SIM_SWITCH_MAX = 11.55
STEP_SCALE = 8128

# JOINT 2: Z axis. Placeholder travel 3.0 in (80 mm), homes at the top first.
[JOINT_2]
TYPE = LINEAR
HOME = 0.0
MIN_LIMIT = -3.0
MAX_LIMIT = 0.0
MAX_VELOCITY = 0.65
MAX_ACCELERATION = 15.0
FERROR = 0.050
MIN_FERROR = 0.010
BACKLASH = 0.0
HOME_OFFSET = 0.05
HOME_SEARCH_VEL = 0.30
HOME_LATCH_VEL = -0.02
HOME_USE_INDEX = NO
HOME_IGNORE_LIMITS = YES
HOME_SEQUENCE = 0
SIM_SWITCH_MIN = -3.05
SIM_SWITCH_MAX = 0.05
STEP_SCALE = 8128

[AXIS_X]
MIN_LIMIT = 0.0
MAX_LIMIT = 15.5
MAX_VELOCITY = 0.65
MAX_ACCELERATION = 15.0

[AXIS_Y]
MIN_LIMIT = 0.0
MAX_LIMIT = 11.5
MAX_VELOCITY = 0.65
MAX_ACCELERATION = 15.0

[AXIS_Z]
MIN_LIMIT = -3.0
MAX_LIMIT = 0.0
MAX_VELOCITY = 0.65
MAX_ACCELERATION = 15.0
